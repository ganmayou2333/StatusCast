[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statuscast"
version = "3.0.0"
description = "Windows bridge that aggregates iPhone battery and media state for pluggable display adapters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pymobiledevice3==11.43.1",
    "bleak>=3.0,<4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
statuscast = "core.daemon:main"

[tool.setuptools.packages.find]
include = ["core*", "adapters*"]
exclude = ["tests*", "scripts*"]
