name: Bug report
description: Report a reproducible problem with StatusCast
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please include enough detail to reproduce it.
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: e.g. Windows 11 23H2
    validations:
      required: true
  - type: input
    id: iphone
    attributes:
      label: iPhone model and iOS version
      description: e.g. iPhone 14 Pro Max, iOS 18.1
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect iPhone via USB
        2. Start StatusCast
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
      description: Include `status_core.py` output and relevant app errors.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
