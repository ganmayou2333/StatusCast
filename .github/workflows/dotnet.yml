name: build-daemon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\src\StatusCast.Daemon\StatusCast.Daemon.csproj

      - name: Build
        run: dotnet build .\src\StatusCast.Daemon\StatusCast.Daemon.csproj -c Release --no-restore
