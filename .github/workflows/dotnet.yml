name: build-daemon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore daemon
        run: dotnet restore .\src\StatusCast.Daemon\StatusCast.Daemon.csproj

      - name: Build daemon
        run: dotnet build .\src\StatusCast.Daemon\StatusCast.Daemon.csproj -c Release --no-restore

      - name: Restore daemon tests
        run: dotnet restore .\tests-csharp\StatusCast.Daemon.Tests\StatusCast.Daemon.Tests.csproj

      - name: Build daemon tests
        run: dotnet build .\tests-csharp\StatusCast.Daemon.Tests\StatusCast.Daemon.Tests.csproj -c Release --no-restore

      - name: Run daemon tests
        env:
          # Loopback integration test (/health + /status/). Works on a normal
          # Windows runner; local sandboxes can leave it off (it is the default).
          STATUSCAST_NETWORK_TESTS: "1"
        run: .\tests-csharp\StatusCast.Daemon.Tests\bin\Release\net10.0\StatusCast.Daemon.Tests.exe
