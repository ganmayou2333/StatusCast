name: build-winui

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\gui\StatusCast.Gui\StatusCast.Gui.csproj -p:Platform=x64

      - name: Build
        run: dotnet build .\gui\StatusCast.Gui\StatusCast.Gui.csproj -c Release -p:Platform=x64 --no-restore
