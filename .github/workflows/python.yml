name: python-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The collectors import optional device libraries lazily, so the offline
      # unit suite needs no pip install of pymobiledevice3 / bleak.
      - name: Run offline unittest suite
        run: python -m unittest discover -s tests -t . -v
